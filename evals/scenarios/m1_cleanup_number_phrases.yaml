# M1 cleanup item 5: Hindi number words 13-100 in amounts.
# Committed BEFORE the code that reads them (leo/language/number_words.py).
# Never edited to improve a score; a better set is a new file with a change log.
#
# Same format as the numbers section of evals/scenarios/m1_6_indian_phrases.yaml:
# each case runs parse_amount(text); expect is an integer, or null for text that
# is not an amount. Correct only on an exact match. Scored with
# evals/m1_6_parser_check.py (a file with no times section is fine).
#
# Rules this set encodes (agreed 2026-11-24, M1 cleanup plan):
#   - The words 13-100 are read in amounts only, never as clock hours (the time
#     parser is unchanged).
#   - "saath"/"sath" also means "with": it is 60 only right before
#     sau/hazaar/lakh/crore or a rupee word.
#   - "sau" or "hazaar" with no number before it is 100 or 1000.
#   - "bees" is also an English word; it is read as 20 and listed with the
#     other words that can mean something else in the parser report.

