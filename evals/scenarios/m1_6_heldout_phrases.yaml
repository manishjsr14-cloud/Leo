# M1.6 held-out phrase set: written by the user without seeing the parser code
# (2026-11-15), converted to the schema of m1_6_indian_phrases.yaml.
# Phrases and expected values are exactly as given; never edited to improve a score.
#
# Schema, defaults and rules: see the header of evals/scenarios/m1_6_indian_phrases.yaml.
# `section` only groups cases in the report; it is not scored.
#
# Conversion notes:
#   - The table gave no default "now". 2026-11-19 16:30 IST (Thursday) is the only
#     value that fits h16-h18 (3 hours -> 19:30, 45 minutes -> 17:15, an hour -> 17:30)
#     and the dates of h01-h20.
#   - h21-h23 were written "... (at 01:30)". The parenthesis is their "now"
#     (2026-11-20 01:30, from h23's expected date), not part of the phrase.
#   - "no time" = time null; "none" = null.

version: 1
now: "2026-11-19T16:30:00+05:30"   # Thursday

