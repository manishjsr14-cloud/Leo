# M1.6 phrase test set: Indian time and number parser (task M1.6).
# Committed BEFORE leo/language/time_parser.py and numbers.py exist.
# Never edited to improve a score; a better set is a new file with a change log.
#
# Done when: >= 95 % of all cases (times + numbers together) are correct.
#
# times: each case runs parse_time(text, now). `now` is the file default unless
# the case gives its own. All times are IST (+05:30).
#   expect fields and their defaults when left out:
#     status: ok            (ok | ask | not_understood)
#     date: null            ("YYYY-MM-DD")
#     time: null            ("HH:MM", 24-hour)
#     assumed_ampm: false   (true when the 1-7 pm / 8-11 am / 12 noon default was used)
#     remind_before_min: null   (reminder offset like "15 minute pehle", in minutes)
#     ask_about: null       (kal | midnight | weekday; only for status ask)
#   A case is correct only when every field above matches exactly.
#
# numbers: each case runs parse_amount(text); expect is an integer, or null for
# text that is not an amount. Correct only on an exact match.
#
# Rules this set encodes (approved 2026-11-14):
#   - No day word: today if the time is still ahead of now, else tomorrow.
#   - "raat" with hours 12-4 means early morning of the following day.
#   - "kal": future signal -> tomorrow; past signal -> yesterday; no signal, both
#     signals, or both tomorrow/yesterday words -> ask (ask_about: kal).
#   - Between 00:00 and 04:00, kal, parso, tomorrow and "day after tomorrow"
#     always return ask (ask_about: midnight). "aaj" stays literal.
#   - Plain weekday: the next one after today; ask if today is that weekday.
#     "agle"/"next" + weekday: ask if that weekday falls in the current week
#     (Monday-Sunday, today included), else the next one.
#   - Relative times ("2 ghante baad", "in 20 minutes") count from now.

