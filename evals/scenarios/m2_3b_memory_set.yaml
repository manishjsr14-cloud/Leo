# --- Same topic, NO update cue: must be ADDED, must NOT replace (3) -----------
same_topic_no_cue:
  - {id: N1, lang: en,       text: "I'm also allergic to dust.",              topic_of: F04}
  - {id: N2, lang: hinglish, text: "Meri choti behen ka naam Isha hai.",     topic_of: F06}
  - {id: N3, lang: hinglish, text: "Mujhe comedy movies bahut pasand hain.", topic_of: F14}

# --- Updates WITH a cue: must REPLACE the old fact (old kept as history) (4) --
updates:
  - {id: U1, lang: en,       text: "I'm not vegetarian anymore, I eat chicken now.",              replaces: F05, cue: "anymore"}
  - {id: U2, lang: en,       text: "I moved to Bangalore last month.",                            replaces: F03, cue: "moved to"}
  - {id: U3, lang: hinglish, text: "Ab main tester nahi hoon, ab developer hoon.",                replaces: F02, cue: "ab ... nahi"}
  - {id: U4, lang: hinglish, text: "Maine Gold's Gym chhod diya, ab ghar pe workout karta hoon.", replaces: F16, cue: "chhod diya"}

# --- Boundary cases: REPORTED ONLY, not scored -------------------------------
# Lasting facts that contain a time or date. Design point 1 ("code rejects
# messages with a date or time") would reject them. Approved handling: a
# preference, habit or yearly word (pasand, prefer, roz, har, every, daily,
# usually, always, hamesha, birthday, anniversary) overrides the time rule.
boundary:
  - {id: B1, lang: hinglish, text: "Mujhe meetings 11 baje ke baad pasand hain.", note: "F2's headline example"}
  - {id: B2, lang: hinglish, text: "Main roz subah 6 baje uthta hoon."}
  - {id: B3, lang: en,       text: "My mother's birthday is on 12 March."}

# --- Personal questions: Recall@5 must include an expected id (15) -----------
# Expected ids refer to the state AFTER the updates (U*), so a replaced fact's
# new version is the right answer. "any_of" = any one of these counts.
questions:
  - {id: Q01, lang: en,       text: "What's my blood group?",          expect_any_of: [F01]}
  - {id: Q02, lang: hinglish, text: "Mujhe kis cheez se allergy hai?", expect_any_of: [F04, N1]}
  - {id: Q03, lang: en,       text: "Where do I live now?",            expect_any_of: [U2]}
  - {id: Q04, lang: hinglish, text: "Meri behen ka naam kya hai?",     expect_any_of: [F06, N2]}
  - {id: Q05, lang: en,       text: "What do I do for work?",          expect_any_of: [U3], note: "en question, hinglish fact"}
  - {id: Q06, lang: hinglish, text: "Mera manager kaun hai?",          expect_any_of: [F17], note: "hinglish question, en fact"}
  - {id: Q07, lang: en,       text: "Do I eat meat?",                  expect_any_of: [U1], note: "synonym: meat / chicken / vegetarian"}
  - {id: Q08, lang: hinglish, text: "Mere doctor ka naam kya hai?",    expect_any_of: [F10]}
  - {id: Q09, lang: en,       text: "Which IPL team do I support?",    expect_any_of: [F11]}
  - {id: Q10, lang: hinglish, text: "Meri gaadi kaunsi hai?",          expect_any_of: [F09], note: "synonym gaadi / car, cross-language"}
  - {id: Q11, lang: en,       text: "What's my dog called?",           expect_any_of: [F20], note: "cross-language"}
  - {id: Q12, lang: hinglish, text: "Main chai kaise peeta hoon?",     expect_any_of: [F08], note: "no my/mera cue: tests the gating words"}
  - {id: Q13, lang: en,       text: "What's my favourite food?",       expect_any_of: [F22], note: "cross-language"}
  - {id: Q14, lang: hinglish, text: "Mere papa kya karte the?",        expect_any_of: [F24]}
  - {id: Q15, lang: en,       text: "Do I like scary films?",          expect_any_of: [F14], note: "synonym scary/horror, films/movies; cross-language"}

# --- Personal questions with NO stored answer (5) ----------------------------
