# M2.3b memory check set (2026-11-26). Written by the user outside the code and
# committed before any M2.3b code. Converted to the project's format without
# changing any message, id or expected result; the original inline comments are
# kept as `note:` fields. Never edit this file to improve a result; a better set
# is a new file (AGENTS.md). All people and facts are fictional.
#
# Run order: facts (F) -> plans/events (P) -> same-topic additions (N)
#            -> updates with a cue (U) -> boundary (B) -> questions (Q, X).
# Each message is sent as a user turn through the real write path.
# "now" for every turn: 2026-11-26 21:00 IST (Thursday).
#
# Done rule (the user's words, fixed before any code):
# - Everything runs end to end through the real write path on the local
#   model, on the laptop, plugged in.
# - Pass: at least 90% of lasting facts stored (F, N and U messages); 0
#   plans/events stored; all 4 cued updates replaced and 0 of the 3 uncued
#   same-topic messages replaced; Recall@5 of at least 0.90 on the 15
#   questions; for the 5 unanswerable questions, no reply states an invented
#   fact. The boundary group is reported only.
# - If any part misses: one fix round, with a fresh question set written
#   before the fixes; if it still misses, close with known limits. The score
#   quoted is always the run on the set written before the code being
#   judged. Any result not covered by these words is decided by the user, not
#   assumed.
#
# How the parts are counted (from the approved proposal, before any code):
# - A lasting fact is stored when a memory row with its text was written
#   during its turn (32 messages: 25 F + 3 N + 4 U; 90% = at least 29).
# - A cued update is replaced when the memory of its `replaces` fact became
#   inactive with replaced_by pointing at the update's memory.
# - A question counts for Recall@5 when the personal-question gate opens and
#   one of its expect_any_of memories is among the 5 nearest active memories.
# - Unanswerable replies are printed in full; code flags whether each holds a
#   "don't know" phrase, and the user judges any reply that does not.
# Also asked for at approval, reported next to the rule: the M1.10 suite with
# memory on (empty store and the store this check leaves) shows no new failures
# against the M1.10 laptop baseline under scorer v2, with how many suite
# messages open the gate and trigger a write; five small-talk messages
# (reported only, not part of this set) and whether each would be stored.

now: "2026-11-26T21:00:00+05:30"

done_rule:
  lasting_stored_min: 0.90       # of the F, N and U messages
  plans_stored_max: 0
  cued_updates_replaced: 4       # of 4
  uncued_replaced_max: 0         # of 3
  recall_at_5_min: 0.90          # on the 15 questions
  unanswerable_invented_max: 0   # of 5
  boundary: reported_only

