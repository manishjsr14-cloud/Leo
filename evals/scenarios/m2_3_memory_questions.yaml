  - {id: F08, lang: en, subject: coffee, text: "I drink two cups of coffee every morning.", fact: "I drink two cups of coffee every morning."}
  - {id: F09, lang: hinglish, subject: allergy, text: "Mujhe peanuts se allergy hai.", fact: "Mujhe peanuts se allergy hai."}
