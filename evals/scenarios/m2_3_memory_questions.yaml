# M2.3 long-term memory check set (architecture sections 4.2, 7, 8.1, 14.7).
# Committed before the memory code. Never edit this file to improve a result;
# a better set is a new file (AGENTS.md).
#
# facts: things the user says that are lasting facts or preferences.
#   text:    the message as the user types it.
#   fact:    what is stored: the user's own words, with "remember" / "yaad rakhna"
#            words taken off (one memory per message).
#   subject: the subject key the fact is stored under. A later fact with the same
#            subject replaces the earlier one (replaces: <fact id>).
# must_not_store: plans, events and passing states, never lasting facts. The
#   extraction step must decide "remember: false" for each (reported in part B).
# questions: scored. expect is the fact id whose memory must be found.
#   g09_style: everyday wording with small margins (the M2.2 g09 limit).
#   negation: the answer is a fact that replaced its opposite.
# no_memory_questions: nothing about them was ever said. RECORDED, NOT SCORED:
#   the report shows how many hints (similarity >= memory.min_similarity) they get.
#
# Part A (the pass rule, fixed before any run; no LLM involved):
#   Save every fact in the order listed, with its fact text and subject, through
#   the real memory store and the real embedder (multilingual-e5-small) into an
#   empty temporary database. Then search each question (top 5, no threshold).
#   Recall@5 = questions whose expected fact is among the 5 results / 20.
#   PASS if Recall@5 >= 0.90 (at least 18 of 20), on the laptop.
# Part B (reported, not part of the rule): every message in write_order goes
#   through the real memory_write node with the local model, into a second empty
#   database. Reported: which messages trigger extraction, remember true/false,
#   the subject given, the 3 replacements, must_not_store kept out, Recall@5 on
#   the store that results, and the time each step took.

pass_rule:
  part: A
  metric: recall_at_5
  min: 0.90
  questions: 20

facts:
  - {id: F01, lang: en, subject: diet, text: "I eat non-veg food.", fact: "I eat non-veg food."}
  - {id: F02, lang: en, subject: meeting_time_preference, text: "I prefer meetings after 11 am.", fact: "I prefer meetings after 11 am."}
