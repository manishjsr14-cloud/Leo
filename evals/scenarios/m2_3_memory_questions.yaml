  - {id: F26, lang: hinglish, subject: father_health, text: "Mere papa ko sugar hai, unke liye meetha mat suggest karna.", fact: "Mere papa ko sugar hai, unke liye meetha mat suggest karna."}
  - {id: F27, lang: en, subject: laptop, text: "My laptop is a Dell G3.", fact: "My laptop is a Dell G3."}
  - {id: F28, lang: hinglish, subject: languages_spoken, text: "Main Marathi aur Hindi dono bolta hoon.", fact: "Main Marathi aur Hindi dono bolta hoon."}
  - {id: F29, lang: en, subject: evening_walk, text: "I usually go for a walk in the evening at 7.", fact: "I usually go for a walk in the evening at 7."}
  - {id: F30, lang: hinglish, subject: favourite_place, text: "Mujhe baarish mein Lonavala jaana bahut pasand hai.", fact: "Mujhe baarish mein Lonavala jaana bahut pasand hai."}
  - {id: F31, lang: en, subject: diet, replaces: F01, text: "I don't eat non-veg anymore.", fact: "I don't eat non-veg anymore."}
  - {id: F32, lang: hinglish, subject: home_city, replaces: F07, text: "Ab main Bangalore mein rehta hoon, Pune chhod diya.", fact: "Ab main Bangalore mein rehta hoon, Pune chhod diya."}
  - {id: F33, lang: hinglish, subject: coffee, replaces: F08, text: "Maine coffee chhod di hai, ab sirf green tea peeta hoon.", fact: "Maine coffee chhod di hai, ab sirf green tea peeta hoon."}

must_not_store:
  - {id: N01, lang: en, text: "I'm going to Pune tomorrow.", why: "a plan"}
  - {id: N02, lang: hinglish, text: "Meri kal meeting hai.", why: "an event"}
  - {id: N03, lang: en, text: "I have a dentist appointment on Friday at 4.", why: "an event"}
  - {id: N04, lang: hinglish, text: "Main aaj bahut thaka hua hoon.", why: "a passing state (g09)"}
  - {id: N05, lang: hinglish, text: "Mera aaj ka lunch Rahul ke saath hai.", why: "an event"}
  - {id: N06, lang: en, text: "I am feeling very tired today.", why: "a passing state (g09)"}
  - {id: N07, lang: hinglish, text: "Kal subah main Lonavala ja raha hoon.", why: "a plan"}

# Part B order: facts in id order, with the must-not-store messages mixed in.
write_order: [F01, F02, F03, N01, F04, F05, F06, F07, N02, F08, F09, F10, F11, N03, F12, F13,
              F14, F15, N04, F16, F17, F18, F19, F20, N05, F21, F22, F23, F24, N06, F25, F26,
              F27, F28, F29, N07, F30, F31, F32, F33]

questions:
  - {id: Q01, lang: hinglish, expect: F31, negation: true, text: "Kya main non-veg khata hoon?"}
  - {id: Q02, lang: en, expect: F31, negation: true, text: "Do I eat meat?"}
  - {id: Q03, lang: hinglish, expect: F32, negation: true, text: "Main kahan rehta hoon?"}
