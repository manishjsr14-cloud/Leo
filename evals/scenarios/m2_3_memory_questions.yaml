  - {id: F05, lang: hinglish, subject: sister_birthday, text: "Meri behen ka birthday 12 March ko hai.", fact: "Meri behen ka birthday 12 March ko hai."}
  - {id: F06, lang: en, subject: brother_birthday, text: "My brother's birthday is on 5 June.", fact: "My brother's birthday is on 5 June."}
