  - {id: F13, lang: hinglish, subject: movie_preference, text: "Mujhe horror movies bilkul pasand nahi hain.", fact: "Mujhe horror movies bilkul pasand nahi hain."}
  - {id: F14, lang: en, subject: sport, text: "I like watching cricket, especially test matches.", fact: "I like watching cricket, especially test matches."}
  - {id: F15, lang: hinglish, subject: wife_name, text: "Meri wife ka naam Anjali hai.", fact: "Meri wife ka naam Anjali hai."}
  - {id: F16, lang: en, subject: doctor, text: "My doctor is Dr. Mehta at Sahyadri hospital.", fact: "My doctor is Dr. Mehta at Sahyadri hospital."}
  - {id: F17, lang: hinglish, subject: sleep_time, text: "Main raat ko 11 baje tak so jaata hoon.", fact: "Main raat ko 11 baje tak so jaata hoon."}
