  - {id: Q06, lang: en, expect: F05, text: "When is my sister's birthday?"}
  - {id: Q07, lang: hinglish, expect: F06, text: "Mere bhai ka birthday kab hai?"}
  - {id: Q08, lang: en, expect: F02, text: "What time do I like to have meetings?"}
  - {id: Q09, lang: hinglish, expect: F09, text: "Mujhe kis cheez se allergy hai?"}
  - {id: Q10, lang: hinglish, expect: F19, text: "Meri chai kaisi banani hai?"}
  - {id: Q11, lang: en, expect: F12, text: "What car do I drive?"}
  - {id: Q12, lang: hinglish, expect: F22, g09_style: true, text: "Thakaan se mujhe kya problem hoti hai?"}
  - {id: Q13, lang: en, expect: F23, g09_style: true, text: "Why do I keep my afternoons light?"}
  - {id: Q14, lang: hinglish, expect: F26, text: "Papa ke khane mein kya dhyan rakhna hai?"}
  - {id: Q15, lang: en, expect: F20, text: "Which class is my son in?"}
  - {id: Q16, lang: hinglish, expect: F18, text: "Main roz subah kitne baje uthta hoon?"}
  - {id: Q17, lang: en, expect: F13, text: "What kind of movies should you not suggest to me?"}
  - {id: Q18, lang: hinglish, expect: F15, text: "Meri wife ka naam kya hai?"}
  - {id: Q19, lang: en, expect: F16, text: "Who is my doctor?"}
  - {id: Q20, lang: hinglish, expect: F21, text: "Mujhe kaunsa khana sabse zyada pasand hai?"}

no_memory_questions:
