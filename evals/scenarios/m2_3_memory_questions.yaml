  - {id: F19, lang: hinglish, subject: tea_sugar, text: "Yaad rakhna, mujhe chai mein cheeni nahi chahiye.", fact: "mujhe chai mein cheeni nahi chahiye."}
  - {id: F20, lang: hinglish, subject: son, text: "Mera beta Aarav class 3 mein padhta hai.", fact: "Mera beta Aarav class 3 mein padhta hai."}
