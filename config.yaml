# Leo settings (architecture §6.4). Secrets go in .env, never here.

llm:
  primary:
    provider: ollama
    model: leo-qwen3               # qwen3:4b built from deploy/ollama/Modelfile
    base_url: http://localhost:11434
    num_ctx: 8192
    think: false
    temperature: 0.7                 # sent on every request; 0.7 is the value the model's
                                   # Ollama parameters gave before (M1.10 runs), so nothing changes
    first_token_timeout_s: 20
    total_timeout_s: 60
    max_bad_outputs: 2             # schema failures before falling back to Groq (6.1)
    warm_up: true                  # CLI start sends one tiny request so the first turn finds the model loaded
    load_timeout_s: 120            # warm-up and background loads wait this long, with no first-token limit:
                                   # a 20 s limit aborted every cold load in the M2.3 check (M2.3 log notes)
  desktop:                         # backup tier; skipped when off, unreachable or gaming
    provider: ollama
    model: qwen3:14b
    base_url: http://leo-desktop:11434   # Tailscale name
    num_ctx: 16384
    think: false
  fallback:
    provider: groq
    model: openai/gpt-oss-120b
    base_url: https://api.groq.com/openai/v1
    reasoning_effort: low          # fast for live requests; judges use medium
    timeout_s: 30
    max_retries: 2                 # SDK retries for rate limits and network blips
  escalate_risk_threshold: 0.7

# Set as Windows environment variables for Ollama (task 0.4); kept here as the record.
ollama_env:
  OLLAMA_FLASH_ATTENTION: "1"
  OLLAMA_KV_CACHE_TYPE: q8_0
  OLLAMA_MAX_LOADED_MODELS: "1"
  OLLAMA_KEEP_ALIVE: 30m

server:
  host: tailscale                  # bind to the Tailscale interface only
  port: 8000
  auth: device_tokens

graph:
  max_hops: 8                      # supervisor -> agent loops before forcing a reply (4.3)

conversation:                      # checkpoints and rolling summary (M2.4, sections 4.6 and 6.6)
  thread_id: laptop-cli            # the CLI's conversation; --thread picks another, --new starts a fresh one
  summarize_after: 12              # more messages than this: the older ones are folded into the summary
  keep_messages: 6                 # the last messages kept as they are (chosen, not measured)

storage:
  db_path: leo_data/leo.db         # relative to the project folder; git-ignored (section 7)

embedder:                          # shared embedder (section 8.1); CPU only, the GPU stays for Ollama
  model: intfloat/multilingual-e5-small
  device: cpu                      # only "cpu" is accepted
  dimension: 384                   # must match the model and the vec0 tables
  cache_dir: models/hf_cache       # Hugging Face download cache; relative to the project folder (D:),
                                   # so the ~0.5 GB of weights stay off the C: drive; git-ignored
  query_prefix: "query: "          # e5: the incoming message and any symmetric comparison
  passage_prefix: "passage: "      # e5: stored texts that queries search (memories, documents)
  cache_size: 256                  # recent message vectors kept for reuse (each message embedded once)

memory:                            # long-term memory (M2.3, section 7)
  search_k: 5                      # nearest memories looked at for each message (Recall@5)
  recall_k: 3                      # the 3 nearest go into the reply prompt as hints, personal questions only
                                   # (M2.3b: no similarity threshold; M2.3's min_similarity 0.88 removed)
  candidate_subjects: 5            # nearest memories shown to the extraction step (subjects; on an update cue, the texts)

agent:
  max_steps: 6                    # tool steps inside one specialist run before it hands back

tracing:                           # Langfuse Cloud (section 13.2); keys and host in .env
  include_text: false              # false: no message text, tool args or replies in traces
  timeout_s: 5                     # startup check and send timeout; tracing turns off if Langfuse is down

research:                          # research agent tools (section 9); public services, no keys
  geocoding_url: https://geocoding-api.open-meteo.com/v1/search
  forecast_url: https://api.open-meteo.com/v1/forecast
  timezone: Asia/Kolkata           # forecast days and "today"/"tomorrow" are in IST
  timeout_s: 10                    # per HTTP request
  max_redirects: 5                 # read_page follows redirects itself, checking each hop
  max_page_bytes: 2000000          # read_page stops downloading after this many bytes
  max_page_chars: 3000             # page text given to the model is cut to this length

language:                          # Indian time and number parser (section 15.2)
  timezone: Asia/Kolkata           # IST; dates and times from the parser are in this zone
  hinglish_min_ratio: 0.2          # share of common Hindi words that tags a message "hinglish" (M1.8)

calendar:                          # calendar agent (section 9.1); mock calendar until M2.6
  default_event_minutes: 60        # an event's length when the user gives no end
  day_parts:                       # part-of-day windows as [start hour, end hour], IST
    morning: [6, 12]               # subah
    afternoon: [12, 16]            # dopahar
    evening: [16, 20]              # shaam
    night: [20, 24]                # raat (24 = midnight at the end of the day)
  waking_hours: [6, 23]            # free time for a whole day is looked for only 06:00-23:00 (M1.8)
  rain_skip_percent: 40            # "agar baarish nahi hogi": no event above this rain chance (M1 exit check)

machines:                          # check-script report headers: label <- text in the nvidia-smi GPU name
  laptop: GTX 1650                 # Dell G3, 4 GB; the target machine for all measurements
  desktop: RTX 3060                # gaming desktop, 12 GB; never compare its figures with the laptop's
